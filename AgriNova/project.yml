name: AgriNova
options:
  bundleIdPrefix: com.agrinova
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # <- put your Apple Team ID here (or pick it in Xcode > Signing)
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
targets:
  AgriNova:
    type: application
    platform: iOS
    sources:
      - path: AgriNova
      - path: Shared
    dependencies:
      - target: AgriNovaWidget
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: AgriNova/AgriNova.entitlements
      properties:
        com.apple.security.application-groups: [group.com.agrinova.app]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.agrinova.app]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.applesignin: [Default]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agrinova.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AgriNova/Info.plist
    info:
      path: AgriNova/Info.plist
      properties:
        CFBundleDisplayName: AgriNova
        CFBundleLocalizations: [en, si, ta]
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: AgriNova uses the camera to photograph crop leaves for on-device disease detection.
        NSPhotoLibraryUsageDescription: AgriNova lets you pick leaf photos from your library for on-device analysis.
        NSLocationWhenInUseUsageDescription: AgriNova uses your location for local weather, nearby outbreak warnings and tagging scans.
        NSLocationAlwaysAndWhenInUseUsageDescription: AgriNova uses background location to remind you when you enter a farm zone.
        NSFaceIDUsageDescription: AgriNova uses Face ID for quick, secure sign-in.
        GIDClientID: YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.googleusercontent.apps.YOUR_GOOGLE_CLIENT_ID]
  AgriNovaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AgriNovaWidget
      - path: Shared
    entitlements:
      path: AgriNovaWidget/AgriNovaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.agrinova.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agrinova.app.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AgriNovaWidget/Info.plist
        SKIP_INSTALL: YES
    info:
      path: AgriNovaWidget/Info.plist
      properties:
        CFBundleDisplayName: AgriNova Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AgriNovaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AgriNovaTests
    dependencies:
      - target: AgriNova
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agrinova.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AgriNova:
    build:
      targets:
        AgriNova: all
        AgriNovaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [AgriNovaTests]
